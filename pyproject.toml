[project]
name = "cryptoquant"
version = "0.1.0"
description = "Cryptocurrency quantitative trading system"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0.0,<5.0.0",
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "loguru>=0.7.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0.0",
    "pytest-cov>=4.0,<6.0.0",
    "pytest-timeout>=2.0,<3.0.0",
    "ruff>=0.1.0,<1.0.0",
    "pyright>=1.1.0,<2.0.0",
]
perf = [
    "numba>=0.59.0,<1.0.0",
]
dashboard = [
    "plotly>=5.20,<6.0",
    "streamlit>=1.38,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "logs", "state"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "F405"]
"**/signals.py" = ["F403"]
"dashboard/**" = ["E402"]  # sys.path bootstrap precedes imports in Streamlit pages

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120
markers = [
    "integration: tests that hit real exchange APIs (skip in CI by default)",
    "slow: tests that take longer than 30 seconds",
]

[tool.coverage.run]
source = ["cryptoquant"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.pyright]
include = ["cryptoquant", "tests"]
exclude = [".venv"]
typeCheckingMode = "standard"
