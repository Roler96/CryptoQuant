[project]
name = "cq"
version = "0.1.0"
description = "Causality-first crypto quant research platform (OKX)"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0.0,<5.0.0",
    "numpy>=1.24.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scipy>=1.11.0,<2.0.0",
    "loguru>=0.7.0,<1.0.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0.0",
    "pytest-cov>=4.0,<7.0.0",
    "pytest-timeout>=2.0,<3.0.0",
    "ruff>=0.1.0,<1.0.0",
    "pyright>=1.1.0,<2.0.0",
]

[project.scripts]
cq = "cq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicit package list: a flat layout without this makes the build backend
# guess, which is how the previous tree ended up with a broken `uv build`.
[tool.hatch.build.targets.wheel]
packages = ["cq"]

# The default universe lives inside the package (cq/config/universe.yaml) so
# that it travels with the wheel. It used to sit at the repository root, and
# the built wheel therefore installed a `cq` command that could not run a
# single subcommand outside the repository: every one of them begins by
# reading the universe from a path relative to the working directory.

[tool.hatch.build.targets.sdist]
include = ["cq", "scripts", "tests", "docs", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Anchored with a leading slash: these are top-level data directories, and
# gitignore semantics would otherwise make a bare "data" match `cq/data/`
# too, silently excluding the entire data package from linting.
exclude = ["/.venv", "/data", "/logs", "/state", "/reports"]

[tool.ruff.lint]
# BLE and S are enabled because the code already carries `noqa` directives for
# them: broad excepts that isolate per-target failures, and f-string SQL over
# internal identifiers. Without the rules enabled those suppressions document
# nothing and nothing is enforced anywhere else.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE", "S"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Tests assert, and reach into internals to verify what was actually stored.
"tests/**" = ["S101", "SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120
markers = [
    "integration: hits the real OKX API (deselect with -m 'not integration')",
    "slow: takes longer than 30 seconds",
]

[tool.coverage.run]
source = ["cq"]
omit = ["tests/*"]

[tool.pyright]
include = ["cq", "tests"]
exclude = [".venv"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
