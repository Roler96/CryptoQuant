# Testnet/paper validation profile for DOGE-USDT-SWAP.
# Set exchange.okx.testnet=false only after the acceptance gates in the
# research note pass and API permissions/order semantics are verified.
exchange:
  default: okx
  okx:
    testnet: true

trading:
  default_timeframe: 4h
  account_type: swap
  strategy: doge_donchian_trend
  min_order_usdt: 10.0
  max_order_usdt: 1000.0
  order_timeout: 30
  cooldown_bars: 1
  stop_loss_pct: null
  # Must stay null: BacktestEngine cannot model a trailing stop, so any
  # value here is an exit rule live would run that the validated baseline
  # (120/60, Sharpe 0.90/0.67/0.69) never saw. DogeDonchianTrend exits on
  # its own 60-bar channel. Re-enabling means first implementing trailing
  # in the backtest and re-running the research protocol.
  trailing_stop_pct: null
  take_profit_pct: null
  max_hold_hours: null
  sizer_method: realized_vol
  sizer_config:
    target_vol_pct: 20.0
    lookback: 180
    periods_per_year: 2190.0
    max_pct: 10.0
    min_order: 10.0

paper_trading:
  enabled: false

# The validated realized-volatility sizer is capped at 10% notional. State it
# explicitly now that max_per_trade_risk_pct is an enforced hard ceiling.
risk:
  max_per_trade_risk_pct: 10.0
