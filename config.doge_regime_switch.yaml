# Testnet/paper validation profile for DogeSpotRegimeSwitch (spot).
# Set exchange.okx.testnet=false only after the acceptance gates in the
# research note pass and API permissions/order semantics are verified.
exchange:
  default: okx
  okx:
    testnet: true

trading:
  default_timeframe: 4h
  account_type: spot
  strategy: doge_spot_regime_switch
  min_order_usdt: 10.0
  max_order_usdt: 100.0       # 100 USDT gray-line limit per research note
  order_timeout: 30
  cooldown_bars: 1
  # Exits belong to the strategy, not to this file. These are engine-level and
  # apply to every position, but only the bear leg is meant to have a 10% /
  # 180h bracket — setting them here silently capped bull Donchian trades that
  # the backtest lets ride the channel. DogeSpotRegimeSwitch.generate_signal()
  # carries the bear bracket itself (bear_take_profit / bear_stop_loss /
  # bear_max_hold), so live and backtest now exit on the same rule.
  stop_loss_pct: null
  trailing_stop_pct: null
  take_profit_pct: null
  max_hold_hours: null
  sizer_method: realized_vol
  sizer_config:
    target_vol_pct: 20.0
    lookback: 180
    periods_per_year: 2190.0
    max_pct: 10.0
    min_order: 10.0

paper_trading:
  enabled: false
