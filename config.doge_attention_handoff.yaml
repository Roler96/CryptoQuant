# Paper-only profile for the DOGE spot attention-handoff candidate.
# It reads public mainnet OKX candles but PaperBroker sends no exchange orders.
exchange:
  default: okx
  okx:
    testnet: false

trading:
  symbol: DOGE/USDT
  default_quote: USDT
  default_timeframe: 1h
  account_type: spot
  strategy: doge_attention_handoff_spot
  min_order_usdt: 10.0
  max_order_usdt: 1000.0
  order_timeout: 30
  # The strategy freezes its own 48h event cooldown.
  cooldown_bars: 0
  stop_loss_pct: null
  trailing_stop_pct: null
  take_profit_pct: null
  # Matches DogeAttentionHandoffSpot.max_hold_bars on 1h bars.
  max_hold_hours: 12
  sizer_method: fixed
  sizer_config:
    risk_pct: 10.0
    min_order: 10.0

paper_trading:
  enabled: true
  initial_balance: 10000.0
  slippage_bps: 5.0
  commission_bps: 10.0
  latency_ms: 300

risk:
  max_positions: 1
  max_daily_trades: 2
  max_daily_loss_pct: 5.0
  max_daily_loss_abs: 500.0
  max_per_trade_risk_pct: 10.0
  max_drawdown_pct: 20.0
  min_balance: 50.0
  emergency_cooldown_minutes: 60
  drawdown_tier1_pct: 10.0
  drawdown_tier2_pct: 15.0
  drawdown_tier3_pct: 20.0
  tier_cooldown_minutes: 30

data:
  db_path: data/cryptoquant.db
  fetch:
    max_candles_per_request: 300
    chunk_days: 7
    timeout_ms: 30000

logging:
  level: INFO
  dir: logs/

alert:
  webhook_url: ""
  alert_levels: ["CRITICAL"]
