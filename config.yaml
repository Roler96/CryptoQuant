exchange:
  default: okx
  okx:
    testnet: true
    rate_limit: true
  binance:
    testnet: true

data:
  db_path: data/cryptoquant.db
  cache:
    max_size: 128
    ttl_seconds: 300
  fetch:
    max_candles_per_request: 300
    chunk_days: 7
    timeout_ms: 30000

trading:
  default_quote: USDT
  min_order_usdt: 10.0

paper_trading:
  enabled: false
  initial_balance: 10000.0
  slippage_bps: 5.0
  latency_ms: 500

logging:
  level: INFO
  dir: logs/
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} | {message}"
