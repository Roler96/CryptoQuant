exchange:
  default: okx
  okx:
    testnet: true
    rate_limit: true
  binance:
    testnet: true

data:
  db_path: data/cryptoquant.db
  fetch:
    max_candles_per_request: 300
    chunk_days: 7
    timeout_ms: 30000

trading:
  default_quote: USDT
  min_order_usdt: 10.0
  max_order_usdt: 1000.0
  order_timeout: 30
  cooldown_bars: 1
  account_type: spot
  stop_loss_pct: null
  take_profit_pct: null
  max_hold_hours: null
  strategy: bb_upper_breakout

risk:
  max_positions: 3
  max_daily_trades: 20
  max_daily_loss_pct: 5.0
  max_daily_loss_abs: 500.0
  max_per_trade_risk_pct: 2.0
  max_drawdown_pct: 20.0
  min_balance: 50.0
  emergency_cooldown_minutes: 60
  drawdown_tier1_pct: 10.0
  drawdown_tier2_pct: 15.0
  drawdown_tier3_pct: 20.0
  tier_cooldown_minutes: 30

paper_trading:
  enabled: true
  initial_balance: 10000.0
  slippage_bps: 5.0
  latency_ms: 500

logging:
  level: INFO
  dir: logs/
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} | {message}"

alert:
  webhook_url: ""
  alert_levels: ["CRITICAL"]
