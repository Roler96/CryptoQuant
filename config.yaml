exchange:
  default: okx
  okx:
    testnet: true
    rate_limit: true
  binance:
    testnet: true

data:
  db_path: data/cryptoquant.db
  fetch:
    max_candles_per_request: 300
    chunk_days: 7
    timeout_ms: 30000

trading:
  default_quote: USDT
  default_timeframe: 5m
  min_order_usdt: 10.0
  max_order_usdt: 1000.0
  order_timeout: 30
  cooldown_bars: 1
  account_type: spot
  stop_loss_pct: null
  take_profit_pct: null
  max_hold_hours: null
  # Deliberately empty: there is no validated default strategy. The only
  # surviving candidate is DogeDonchianTrend, and it needs 4h/swap rather
  # than the 5m/spot defaults above — naming it here would hand a bare
  # `live_runner.py` a strategy running on the wrong timeframe and account
  # type. Run it through its own profile instead:
  #     uv run python live_runner.py --config config.doge_donchian.yaml
  # Leaving this empty makes live_runner exit with that instruction rather
  # than start something unvalidated.
  strategy: ""

risk:
  max_positions: 3
  max_daily_trades: 20
  max_daily_loss_pct: 5.0
  max_daily_loss_abs: 500.0
  max_per_trade_risk_pct: 2.0
  max_drawdown_pct: 20.0
  min_balance: 50.0
  emergency_cooldown_minutes: 60
  drawdown_tier1_pct: 10.0
  drawdown_tier2_pct: 15.0
  drawdown_tier3_pct: 20.0
  tier_cooldown_minutes: 30

paper_trading:
  enabled: true
  initial_balance: 10000.0
  slippage_bps: 1.0
  latency_ms: 300
  commission_bps: 10.0

logging:
  level: INFO
  dir: logs/
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} | {message}"

alert:
  webhook_url: ""
  alert_levels: ["CRITICAL"]
